<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Wealth Watch · Spending Tracker</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Drop in your credit card or bank statements and see where your money goes. Everything runs in your browser.">
        <meta name="theme-color" content="#059669">
        <link rel="icon" type="image/png" href="budget/images/budgetIcon1.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="budget/styles.css" rel="stylesheet">
        <script>
            try {
                var saved = JSON.parse(localStorage.getItem('wealth-watch:v1') || '{}').theme;
                var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) {}
        </script>
        <style>
            #backToHome {
                position: fixed;
                left: 16px;
                bottom: 16px;
                z-index: 30;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 8px 14px;
                border-radius: 999px;
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--text-2);
                box-shadow: var(--shadow-lg);
                font: 600 13px/1 var(--font);
                text-decoration: none;
                transition: color 0.15s, border-color 0.15s, transform 0.15s;
            }
            #backToHome:hover {
                color: var(--text);
                border-color: var(--accent);
                transform: translateY(-1px);
            }
            @media (max-width: 560px) {
                #backToHome span {
                    display: none;
                }
                #backToHome {
                    padding: 10px;
                }
            }
        </style>
    </head>
    <body>
        <a href="index.html" id="backToHome" aria-label="Back to portfolio">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span>Portfolio</span>
        </a>
        <div id="app"></div>
        <script src="budget/bundle.js"></script>
    </body>
</html>
